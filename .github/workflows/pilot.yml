name: Canter Isolated Live Pilot

on:
  workflow_dispatch:
    inputs:
      run_canary:
        description: Start the disposable Canter runner canary after cleanup validation
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: canter-isolated-live-pilot
  cancel-in-progress: false

jobs:
  canary:
    name: Canter Runner Canary
    if: ${{ inputs.run_canary }}
    runs-on: canter
    timeout-minutes: 5
    steps:
      - name: Verify isolated non-root Linux execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(id -u)" -gt 0
          test "$RUNNER_OS" = Linux
          test "$(getconf _NPROCESSORS_ONLN)" -eq 4
          test -z "${CANTER_PILOT_CLEANUP:-}"
          test -z "${CANTER_COMPUTE_PASSWORD:-}"
          test -z "${CANTER_COMPUTE_USERNAME:-}"
          test -z "${CANTER_CI_GITHUB_APP_PRIVATE_KEY_FILE:-}"
          printf '%s\n' 'Canter live canary passed on a non-root 4-vCPU Linux runner.'
