name: Canter Isolated Live Pilot

on:
  workflow_dispatch:
    inputs:
      run_canary:
        description: Start the disposable Canter runner canary after cleanup validation
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: canter-isolated-live-pilot
  cancel-in-progress: false

jobs:
  watchdog:
    name: Independent Cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANTER_PILOT_CLEANUP: ${{ secrets.CANTER_PILOT_CLEANUP }}
    steps:
      - name: Prepare cleanup controller
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/canter-ci-cleanup.py" <<'PY'
          #!/usr/bin/env python3
          """Canter CI isolated pilot cleanup controller.
          
          ``preflight`` validates read access to the exact pilot-owned provider
          resources and requires that none exist yet. ``watch`` observes the pilot
          window, reports the owned VM once seen, verifies parent-side cleanup,
          or performs strictly ownership-verified teardown of the disposable VM,
          its ports, and its security group after the deadline.
          
          Stdlib only. Every provider call uses the system ``curl`` binary with
          the auth token delivered through the curl config on stdin - never in
          argv, the child environment, or logs. All diagnostics are sanitized to
          generic enums and HTTP statuses; tokens, URLs, bodies, and provider
          payloads are never printed or persisted.
          """
          
          import json
          import os
          import re
          import signal
          import subprocess
          import sys
          import time
          import urllib.parse
          
          SCHEMA_VERSION = 1
          CONFIG_ENV = 'CANTER_PILOT_CLEANUP'
          
          UUID_RE = re.compile(
              r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')
          COMPUTE_RE = re.compile(
              r'https://hostvds\.com/os-api/eu-north1/compute/v2\.1/[0-9a-f]{32}')
          NETWORK_BASE = 'https://hostvds.com/os-api/eu-north1/network'
          TOKEN_RE = re.compile(r'[\x21-\x7e]+')
          
          CONFIG_KEYS = frozenset({
              'schemaVersion', 'token', 'compute', 'network', 'operation',
              'vmName', 'groupName', 'groupDescription', 'networkId',
              'cleanupAt', 'tokenExpiresAt',
          })
          
          MAX_BODY = 4194304
          CURL_TIMEOUT = 15
          OBSERVE_INTERVAL = 30
          CLEANUP_INTERVAL = 10
          MAX_LIFETIME = 2700
          MIN_PREFLIGHT_AHEAD = 1200
          TOKEN_MARGIN = 900
          CLEANUP_WINDOW = 600
          
          LINK_KEYS = (
              'servers_links', 'security_groups_links', 'ports_links',
              'images_links', 'flavors_links', 'networks_links', 'subnets_links',
              'next',
          )
          
          
          class PilotError(Exception):
              """Sanitized failure: generic kind plus optional HTTP status only."""
          
              def __init__(self, kind, status=None):
                  super().__init__(kind)
                  self.kind = kind
                  self.status = status
          
          
          def _is_int(value):
              return isinstance(value, int) and not isinstance(value, bool)
          
          
          def _is_uuid(value):
              return isinstance(value, str) and UUID_RE.fullmatch(value) is not None
          
          
          def _reject_constant(value):
              raise ValueError('non-finite constant')
          
          
          def _no_duplicate_keys(pairs):
              obj = {}
              for key, value in pairs:
                  if key in obj:
                      raise ValueError('duplicate key')
                  obj[key] = value
              return obj
          
          
          def _strict_loads(raw):
              """Parse bounded JSON, rejecting duplicates, NaN/Infinity, non-UTF8."""
              if not isinstance(raw, (bytes, bytearray)):
                  raise PilotError('unsafe_source')
              if len(raw) > MAX_BODY:
                  raise PilotError('unsafe_source')
              try:
                  text = bytes(raw).decode('utf-8')
              except UnicodeDecodeError:
                  raise PilotError('unsafe_source')
              try:
                  return json.loads(
                      text,
                      object_pairs_hook=_no_duplicate_keys,
                      parse_constant=_reject_constant)
              except (ValueError, TypeError, RecursionError):
                  raise PilotError('unsafe_source')
          
          
          def _json_dict(raw):
              obj = _strict_loads(raw)
              if not isinstance(obj, dict):
                  raise PilotError('unsafe_source')
              return obj
          
          
          def _pagination_safe(obj):
              """Refuse partial sources: any 'next' link means incomplete data."""
              for key in LINK_KEYS:
                  value = obj.get(key)
                  if value is None:
                      continue
                  if key == 'next':
                      if value:
                          return False
                      continue
                  if not isinstance(value, list):
                      return False
                  for link in value:
                      if not isinstance(link, dict):
                          return False
                      if link.get('rel') == 'next':
                          return False
              return True
          
          
          def load_config(env, now, mode):
              """Validate CANTER_PILOT_CLEANUP JSON; returns the config dict."""
              raw = env.get(CONFIG_ENV)
              if not isinstance(raw, str) or not raw:
                  raise PilotError('config')
              try:
                  cfg = json.loads(
                      raw,
                      object_pairs_hook=_no_duplicate_keys,
                      parse_constant=_reject_constant)
              except (ValueError, TypeError, RecursionError):
                  raise PilotError('config')
              if not isinstance(cfg, dict) or set(cfg.keys()) != CONFIG_KEYS:
                  raise PilotError('config')
          
              if cfg['schemaVersion'] != SCHEMA_VERSION or not _is_int(
                      cfg['schemaVersion']):
                  raise PilotError('config')
          
              token = cfg['token']
              if not isinstance(token, str) or TOKEN_RE.fullmatch(token) is None:
                  raise PilotError('config')
          
              if not isinstance(cfg['compute'], str) or COMPUTE_RE.fullmatch(
                      cfg['compute']) is None:
                  raise PilotError('config')
              if cfg['network'] != NETWORK_BASE:
                  raise PilotError('config')
              if not _is_uuid(cfg['operation']):
                  raise PilotError('config')
              if cfg['vmName'] != 'canter-ci-pilot-' + cfg['operation']:
                  raise PilotError('config')
              if cfg['groupName'] != cfg['vmName'] + '-sg':
                  raise PilotError('config')
              if cfg['groupDescription'] != 'Canter CI pilot ' + cfg['operation']:
                  raise PilotError('config')
              if not _is_uuid(cfg['networkId']):
                  raise PilotError('config')
          
              cleanup_at = cfg['cleanupAt']
              expires_at = cfg['tokenExpiresAt']
              if not _is_int(cleanup_at) or cleanup_at <= 0:
                  raise PilotError('config')
              if not _is_int(expires_at) or expires_at <= 0:
                  raise PilotError('config')
              if cleanup_at > now + MAX_LIFETIME:
                  raise PilotError('config')
              if expires_at < cleanup_at + TOKEN_MARGIN:
                  raise PilotError('config')
              if mode == 'preflight' and cleanup_at < now + MIN_PREFLIGHT_AHEAD:
                  raise PilotError('config')
              return cfg
          
          
          def _curl_env():
              env = {}
              for key in ('PATH', 'HOME', 'LANG'):
                  value = os.environ.get(key)
                  if value:
                      env[key] = value
              return env
          
          
          def _curl_escape(value):
              return value.replace('\\', '\\\\').replace('"', '\\"')
          
          
          def _curl_config_text(method, url, token):
              for bad in ('"', '\\', '\n', '\r'):
                  if bad in url:
                      raise PilotError('internal')
              return '\n'.join((
                  'silent',
                  'show-error',
                  'ipv4',
                  'compressed',
                  'max-time = "15"',
                  'max-filesize = "4194304"',
                  'proto = "=https"',
                  'url = "%s"' % url,
                  'request = "%s"' % method,
                  'header = "X-Auth-Token: %s"' % _curl_escape(token),
                  'write-out = "\\n__CANTER_HTTP_STATUS__%{http_code}"',
              )) + '\n'
          
          
          def _curl_call(cfg, method, url):
              """One HTTPS request via curl; token only inside stdin config."""
              if not url.startswith('https://'):
                  raise PilotError('internal')
              config = _curl_config_text(method, url, cfg['token'])
              try:
                  proc = subprocess.run(
                      ['curl', '--disable', '--config', '-'],
                      input=config.encode('utf-8'),
                      capture_output=True,
                      env=_curl_env(),
                      timeout=CURL_TIMEOUT + 5)
              except (OSError, subprocess.SubprocessError):
                  raise PilotError('transport')
              body, sep, meta = proc.stdout.rpartition(
                  b'__CANTER_HTTP_STATUS__')
              if not sep:
                  raise PilotError('transport')
              try:
                  status = int(meta.strip())
              except ValueError:
                  raise PilotError('transport')
              if proc.returncode != 0:
                  raise PilotError('transport')
              return status, body
          
          
          def _expected_metadata(cfg):
              return {
                  'canter.managed': 'true',
                  'canter.operation': cfg['operation'],
                  'canter.resource': cfg['vmName'],
                  'canter.sandbox': 'ci-live-pilot',
              }
          
          
          def _server_owned(server, cfg):
              meta = server.get('metadata')
              return isinstance(meta, dict) and dict(meta) == _expected_metadata(cfg)
          
          
          def _group_owned(group, cfg):
              return (group.get('name') == cfg['groupName']
                      and group.get('description') == cfg['groupDescription'])
          
          
          def _port_owned(port, server_id, network_id, group_id):
              owner = port.get('device_owner')
              return (port.get('device_id') == server_id
                      and port.get('network_id') == network_id
                      and isinstance(owner, str)
                      and owner.startswith('compute:')
                      and port.get('security_groups') == [group_id])
          
          
          class Controller:
              """Preflight/watch logic over an injectable transport/clock/sleep."""
          
              def __init__(self, cfg, transport, clock=None, sleep=None):
                  self.cfg = cfg
                  self._transport = transport
                  self._now = clock if clock is not None else (lambda: int(time.time()))
                  self._sleep = sleep if sleep is not None else time.sleep
                  self.signalled = False
                  self._observed_printed = False
                  self._seen_server = False
                  self.retained_servers = []
                  self.retained_groups = []
                  self.retained_ports = []
          
              # -- diagnostics ----------------------------------------------------
          
              def _log(self, kind, status=None):
                  line = 'PILOT_CLEANUP_ERROR kind=' + kind
                  if status is not None:
                      line += ' status=' + str(status)
                  print(line, file=sys.stderr)
          
              def _log_error(self, error):
                  self._log(error.kind, error.status)
          
              # -- low-level provider access --------------------------------------
          
              def _request(self, method, url):
                  return self._transport(method, url)
          
              def _get_json(self, url):
                  status, body = self._request('GET', url)
                  if status != 200:
                      raise PilotError('http', status)
                  return _json_dict(body)
          
              def _delete_named(self, get_path, delete_path, owned_check,
                                on_verified=None):
                  """Fresh-check delete; True only when an independent GET confirms 404."""
                  status, body = self._request('GET', get_path)
                  if status == 404:
                      return True
                  if status != 200:
                      raise PilotError('http', status)
                  obj = _json_dict(body)
                  if not owned_check(obj):
                      self._log('conflict')
                      return False
                  if on_verified is not None:
                      on_verified()
                  status, _body = self._request('DELETE', delete_path)
                  if status == 409:
                      self._log('http', 409)
                      return False
                  if status not in (202, 204, 404):
                      raise PilotError('http', status)
                  status, _body = self._request('GET', get_path)
                  if status == 404:
                      return True
                  if status == 200:
                      return False
                  raise PilotError('http', status)
          
              # -- discovery --------------------------------------------------------
          
              def _discover_named(self, url, key, name, owned_pred):
                  obj = self._get_json(url)
                  if not _pagination_safe(obj):
                      raise PilotError('unsafe_source')
                  items = obj.get(key)
                  if not isinstance(items, list):
                      raise PilotError('unsafe_source')
                  owned, foreign = [], False
                  for item in items:
                      if not isinstance(item, dict):
                          raise PilotError('unsafe_source')
                      if item.get('name') != name:
                          continue
                      if owned_pred(item):
                          owned.append(item)
                      else:
                          foreign = True
                  for item in owned:
                      if not _is_uuid(item.get('id')):
                          raise PilotError('unsafe_source')
                  return {
                      'owned': owned,
                      'foreign': foreign,
                      'ambiguous': len(owned) > 1,
                  }
          
              def discover(self):
                  cfg = self.cfg
                  servers_url = (cfg['compute'] + '/servers/detail?name='
                                 + urllib.parse.quote(cfg['vmName'], safe=''))
                  groups_url = (NETWORK_BASE + '/v2.0/security-groups?name='
                                + urllib.parse.quote(cfg['groupName'], safe=''))
                  servers = self._discover_named(
                      servers_url, 'servers', cfg['vmName'],
                      lambda item: _server_owned(item, cfg))
                  groups = self._discover_named(
                      groups_url, 'security_groups', cfg['groupName'],
                      lambda item: _group_owned(item, cfg))
                  return {
                      'servers': servers['owned'],
                      'groups': groups['owned'],
                      'ambiguous': servers['ambiguous'] or groups['ambiguous'],
                      'conflict': servers['foreign'] or groups['foreign'],
                  }
          
              def _remember(self, disc):
                  for item in disc['servers']:
                      sid = item.get('id')
                      if sid not in self.retained_servers:
                          self.retained_servers.append(sid)
                  for item in disc['groups']:
                      gid = item.get('id')
                      if gid not in self.retained_groups:
                          self.retained_groups.append(gid)
          
              def _remember_port(self, port_id):
                  if port_id not in self.retained_ports:
                      self.retained_ports.append(port_id)
          
              # -- resource flows ---------------------------------------------------
          
              def _delete_server(self, server_id):
                  base = self.cfg['compute'] + '/servers/' + server_id
          
                  def owned(obj):
                      server = obj.get('server')
                      return (isinstance(server, dict)
                              and server.get('id') == server_id
                              and server.get('name') == self.cfg['vmName']
                              and _server_owned(server, self.cfg))
          
                  return self._delete_named(base, base, owned)
          
              def _delete_ports(self, server_id, group_id):
                  """Delete every binding-verified port; True iff all reached 404."""
                  if group_id is None:
                      return True
                  cfg = self.cfg
                  list_url = (NETWORK_BASE + '/v2.0/ports?device_id='
                              + urllib.parse.quote(server_id, safe=''))
                  obj = self._get_json(list_url)
                  if not _pagination_safe(obj):
                      raise PilotError('unsafe_source')
                  ports = obj.get('ports')
                  if not isinstance(ports, list):
                      raise PilotError('unsafe_source')
                  all_gone = True
                  for port in ports:
                      if not isinstance(port, dict):
                          raise PilotError('unsafe_source')
                      if not _port_owned(port, server_id, cfg['networkId'], group_id):
                          continue
                      port_id = port.get('id')
                      if not _is_uuid(port_id):
                          raise PilotError('unsafe_source')
                      if not self._delete_port(port_id, server_id, group_id):
                          all_gone = False
                  return all_gone
          
              def _delete_port(self, port_id, server_id, group_id):
                  cfg = self.cfg
                  base = NETWORK_BASE + '/v2.0/ports/' + port_id
          
                  def owned(obj):
                      port = obj.get('port')
                      return (isinstance(port, dict)
                              and port.get('id') == port_id
                              and _port_owned(port, server_id, cfg['networkId'],
                                              group_id))
          
                  return self._delete_named(
                      base, base, owned,
                      on_verified=lambda: self._remember_port(port_id))
          
              def _delete_group(self, group_id):
                  cfg = self.cfg
                  base = NETWORK_BASE + '/v2.0/security-groups/' + group_id
          
                  def owned(obj):
                      group = obj.get('security_group')
                      return (isinstance(group, dict)
                              and group.get('id') == group_id
                              and _group_owned(group, cfg))
          
                  return self._delete_named(base, base, owned)
          
              # -- independent absence proof ----------------------------------------
          
              def _ports_clear_for(self, server_ids):
                  """READ-ONLY: every known VM's port list empty; every retained
                  port ID independently GETs 404. Raises on transport/http/parse/
                  pagination; False while anything remains."""
                  for server_id in server_ids:
                      list_url = (NETWORK_BASE + '/v2.0/ports?device_id='
                                  + urllib.parse.quote(server_id, safe=''))
                      obj = self._get_json(list_url)
                      if not _pagination_safe(obj):
                          raise PilotError('unsafe_source')
                      ports = obj.get('ports')
                      if not isinstance(ports, list):
                          raise PilotError('unsafe_source')
                      if ports:
                          return False
                  for port_id in self.retained_ports:
                      url = NETWORK_BASE + '/v2.0/ports/' + port_id
                      status, _body = self._request('GET', url)
                      if status == 404:
                          continue
                      if status == 200:
                          return False
                      raise PilotError('http', status)
                  return True
          
              def _absence_verified(self):
                  """READ-ONLY proof that every retained owned ID is gone: each VM,
                  SG, and port independently GETs 404 and every known VM's port
                  list is empty. Never deletes; never trusts filtered lists."""
                  for server_id in self.retained_servers:
                      url = self.cfg['compute'] + '/servers/' + server_id
                      status, _body = self._request('GET', url)
                      if status == 404:
                          continue
                      if status == 200:
                          return False
                      raise PilotError('http', status)
                  for group_id in self.retained_groups:
                      url = (NETWORK_BASE + '/v2.0/security-groups/'
                             + group_id)
                      status, _body = self._request('GET', url)
                      if status == 404:
                          continue
                      if status == 200:
                          return False
                      raise PilotError('http', status)
                  return self._ports_clear_for(self.retained_servers)
          
              # -- modes -------------------------------------------------------------
          
              def preflight(self):
                  disc = self.discover()
                  if disc['ambiguous']:
                      raise PilotError('unsafe_source')
                  if disc['conflict']:
                      raise PilotError('conflict')
                  if disc['servers'] or disc['groups']:
                      raise PilotError('resources_present')
                  print('PILOT_CLEANUP_ACCESS_VALIDATED')
          
              def _owned_ids(self, items, retained):
                  ids = []
                  for item in items:
                      ids.append(item.get('id'))
                  for rid in retained:
                      ids.append(rid)
                  result = []
                  for rid in ids:
                      if rid not in result:
                          result.append(rid)
                  return result
          
              def _cleanup_round(self):
                  disc = self.discover()
                  self._remember(disc)
                  if disc['ambiguous']:
                      self._log('unsafe_source')
                      return False
                  if disc['conflict']:
                      self._log('conflict')
                  server_ids = self._owned_ids(disc['servers'], self.retained_servers)
                  group_ids = self._owned_ids(disc['groups'], self.retained_groups)
          
                  gone_servers = set()
                  for server_id in server_ids:
                      if self._delete_server(server_id):
                          gone_servers.add(server_id)
          
                  sg_for_ports = group_ids[0] if len(group_ids) == 1 else None
                  if len(group_ids) > 1:
                      self._log('unsafe_source')
                  ports_ok = True
                  for server_id in sorted(gone_servers):
                      if not self._delete_ports(server_id, sg_for_ports):
                          ports_ok = False
          
                  # SG teardown only after every known server is confirmed 404 and
                  # every known VM's port list is empty plus retained ports 404.
                  servers_all_gone = all(sid in gone_servers for sid in server_ids)
                  groups_ok = True
                  if servers_all_gone and self._ports_clear_for(server_ids):
                      for gid in group_ids:
                          if not self._delete_group(gid):
                              groups_ok = False
          
                  final = self.discover()
                  self._remember(final)
                  if (final['ambiguous'] or final['conflict']
                          or final['servers'] or final['groups']):
                      return False
                  return (self._absence_verified()
                          and ports_ok and groups_ok)
          
              def _cleanup(self, hard_deadline):
                  streak = 0
                  while True:
                      if self._now() >= hard_deadline:
                          self._log('deadline')
                          return 1
                      try:
                          empty = self._cleanup_round()
                      except PilotError as error:
                          self._log_error(error)
                          empty = False
                      if empty:
                          streak += 1
                          if streak >= 2:
                              print('PILOT_CLEANUP_VERIFIED')
                              return 0
                      else:
                          streak = 0
                      self._sleep(CLEANUP_INTERVAL)
          
              def watch(self):
                  deadline = self.cfg['cleanupAt']
                  hard_deadline = deadline + CLEANUP_WINDOW
                  streak = 0
                  while True:
                      if self.signalled or self._now() >= deadline:
                          break
                      try:
                          disc = self.discover()
                      except PilotError as error:
                          self._log_error(error)
                          streak = 0
                          self._sleep(OBSERVE_INTERVAL)
                          continue
                      self._remember(disc)
                      if disc['ambiguous'] or disc['conflict']:
                          self._log('unsafe_source' if disc['ambiguous']
                                    else 'conflict')
                      if disc['servers']:
                          self._seen_server = True
                          if not self._observed_printed:
                              self._observed_printed = True
                              print('PILOT_RESOURCE_OBSERVED')
                          streak = 0
                      elif (self._seen_server
                              and not (disc['ambiguous'] or disc['conflict']
                                       or disc['groups'])):
                          # List-empty alone is not proof: every retained ID must
                          # independently GET 404 and port lists must be empty.
                          try:
                              absent = self._absence_verified()
                          except PilotError as error:
                              self._log_error(error)
                              streak = 0
                              self._sleep(OBSERVE_INTERVAL)
                              continue
                          if absent:
                              streak += 1
                              if streak >= 2:
                                  print('PILOT_CLEANUP_VERIFIED')
                                  return 0
                          else:
                              streak = 0
                      else:
                          streak = 0
                      self._sleep(OBSERVE_INTERVAL)
                  return self._cleanup(hard_deadline)
          
          
          def _install_signal_handlers(controller):
              def handler(signum, _frame):
                  controller.signalled = True
              signal.signal(signal.SIGINT, handler)
              signal.signal(signal.SIGTERM, handler)
          
          
          def main(argv):
              if len(argv) != 2 or argv[1] not in ('preflight', 'watch'):
                  print('usage: canter-ci-pilot-cleanup.py {preflight|watch}',
                        file=sys.stderr)
                  return 2
              mode = argv[1]
              now = int(time.time())
              try:
                  cfg = load_config(os.environ, now, mode)
              except PilotError as error:
                  print('PILOT_CLEANUP_ERROR kind=' + error.kind, file=sys.stderr)
                  return 1
              transport = lambda method, url: _curl_call(cfg, method, url)
              controller = Controller(cfg, transport)
              try:
                  if mode == 'preflight':
                      controller.preflight()
                      return 0
                  _install_signal_handlers(controller)
                  return controller.watch()
              except PilotError as error:
                  controller._log_error(error)
                  return 1
          
          
          if __name__ == '__main__':
              sys.exit(main(sys.argv))
          PY
      - name: Validate cleanup access
        shell: bash
        run: python3 "$RUNNER_TEMP/canter-ci-cleanup.py" preflight
      - name: Enforce pilot teardown
        if: ${{ inputs.run_canary }}
        shell: bash
        run: python3 "$RUNNER_TEMP/canter-ci-cleanup.py" watch

  canary:
    name: Canter Runner Canary
    if: ${{ inputs.run_canary }}
    runs-on: canter
    timeout-minutes: 5
    steps:
      - name: Verify isolated non-root Linux execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(id -u)" -gt 0
          test "$RUNNER_OS" = Linux
          test "$(getconf _NPROCESSORS_ONLN)" -eq 4
          test -z "${CANTER_PILOT_CLEANUP:-}"
          test -z "${CANTER_COMPUTE_PASSWORD:-}"
          test -z "${CANTER_COMPUTE_USERNAME:-}"
          test -z "${CANTER_CI_GITHUB_APP_PRIVATE_KEY_FILE:-}"
          printf '%s\n' 'Canter live canary passed on a non-root 4-vCPU Linux runner.'
